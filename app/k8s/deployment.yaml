# Deployment for the orders-api demo service.
#
# Sized for a 4 CPU / 8 GB minikube. Two replicas, because a single replica
# teaches you nothing about rolling updates, PodDisruptionBudgets or the
# "which pod is the slow one?" question that the `pod` label on every metric
# exists to answer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: demo
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/instance: orders-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: k8s-observability-stack
    app.kubernetes.io/version: "0.1.0"
  annotations:
    # Surfaced by `kubectl rollout history`. In a real pipeline this would be
    # populated by CI with the commit and build URL.
    kubernetes.io/change-cause: "Initial deployment of orders-api 0.1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
      app.kubernetes.io/instance: orders-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # With 2 replicas: never drop below 2 ready (surge first, then terminate).
      # This plus the app's drain-on-SIGTERM is what makes deploys invisible in
      # the availability SLI. A deploy that burns error budget is a deploy you
      # will become reluctant to do, which is how teams end up shipping monthly.
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
        app.kubernetes.io/instance: orders-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: k8s-observability-stack
        app.kubernetes.io/version: "0.1.0"
      annotations:
        # ------------------------------------------------------------------
        # ANNOTATION-BASED SCRAPING (the alternative to a ServiceMonitor)
        #
        # These three annotations are the classic pre-Operator convention. They
        # only do anything if Prometheus has a kubernetes_sd_config with
        # relabel rules that read them — kube-prometheus-stack does NOT ship
        # such a job by default, so on this stack they are documentation rather
        # than configuration.
        #
        # They are left here deliberately, because in an interview "why are
        # these annotations here and do they work?" is a good question:
        #   - annotations are simple and need no CRD, but they are an opaque
        #     string contract with no validation and no per-target overrides
        #   - a ServiceMonitor is a typed, namespaced, RBAC-controlled object
        #     you can `kubectl explain`, version and review
        # This repo uses the ServiceMonitor (see servicemonitor.yaml).
        # ------------------------------------------------------------------
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"

        # Forces a rolling restart when the config changes. In a real repo this
        # would be a checksum of the ConfigMap/Secret contents, generated by
        # Helm or Kustomize.
        observability/config-revision: "1"
    spec:
      # Spread across nodes when there is more than one. ScheduleAnyway (not
      # DoNotSchedule) so this still schedules on single-node minikube.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orders-api

      # Give the app time to drain. Must be comfortably larger than the app's
      # DRAIN_SECONDS plus the longest in-flight request, or the kubelet SIGKILLs
      # mid-request and you lose the buffered spans.
      terminationGracePeriodSeconds: 45

      # Pod-level security context. The namespace enforces the `restricted` Pod
      # Security Standard, so all of this is mandatory, not optional.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532          # the distroless `nonroot` uid
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: orders-api
          # Built straight into minikube's docker daemon by scripts/deploy-app,
          # so there is no registry and no pull. IfNotPresent (never Always) is
          # essential here — Always would try to pull from Docker Hub and fail
          # with ErrImagePull.
          image: orders-api:0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http          # referenced by Service .targetPort
              containerPort: 8080
              protocol: TCP

          env:
            # --- Application ------------------------------------------------
            - name: PORT
              value: "8080"
            - name: DRAIN_SECONDS
              value: "5"

            # Fault injection. Enabled in this repo because demonstrating that
            # the alerting works is the entire point. In a production manifest
            # this would be absent, and the chaos routes would not even be
            # registered (see newMux() in main.go).
            - name: CHAOS_ENABLED
              value: "true"

            # --- OpenTelemetry ----------------------------------------------
            # service.name is THE identity attribute: Tempo's metrics-generator
            # builds the service graph from it, and Grafana's tracesToMetrics
            # queries join on it.
            - name: OTEL_SERVICE_NAME
              value: "orders-api"

            # Tempo's OTLP gRPC receiver. Port 4317 is gRPC; 4318 is HTTP. Using
            # 4318 with the gRPC exporter fails silently — no spans, no error.
            # See docs/troubleshooting.md "Tempo not receiving spans".
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"

            # Resource attributes attached to every span. deployment.environment
            # is what lets you filter "prod vs staging" in Tempo later.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=demo,deployment.environment=minikube"

            # Sample everything. Fine at demo traffic levels; in production this
            # would be a few percent head sampling, or tail sampling in a
            # collector so you keep 100% of errors and slow traces.
            - name: OTEL_TRACES_SAMPLER_RATIO
              value: "1.0"

            # --- Kubernetes downward API ------------------------------------
            # Injecting pod identity into the process means the app can log it,
            # and it keeps the logs joinable with the metrics (which get `pod`
            # from the Prometheus service discovery relabelling).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            # --- Go runtime --------------------------------------------------
            # GOMEMLIMIT is a soft limit that makes the Go GC work harder as the
            # heap approaches it, instead of letting RSS sail past the cgroup
            # limit and get the container OOMKilled with no warning. Set it to
            # roughly 85-90% of the memory limit below (256Mi -> ~220MiB).
            # This single line prevents a large fraction of real-world Go OOMs.
            - name: GOMEMLIMIT
              value: "220MiB"
            # Match GOMAXPROCS to the CPU limit. Without this, the Go runtime
            # sees the NODE's core count, spawns that many Ps, and spends its
            # time being CFS-throttled instead of working.
            - name: GOMAXPROCS
              value: "1"

          resources:
            # Requests drive scheduling and are what you are actually billed for
            # in a real cluster. Kept small so the whole stack fits in an 8 GB
            # minikube alongside Prometheus, Loki, Tempo and Grafana.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # No CPU limit would arguably be better (CFS throttling causes
              # more latency problems than it solves), but a limit is set here
              # so that /chaos/cpu produces visible throttling for the demo.
              cpu: 500m
              # 256Mi against a GOMEMLIMIT of 220MiB. /chaos/leak?mb=200 will
              # blow through this and get the container OOMKilled on purpose —
              # that is how runbooks/ContainerOOMKilled.md is demonstrated.
              memory: 256Mi

          # --- Probes --------------------------------------------------------
          # Three distinct probes doing three distinct jobs. Collapsing them
          # into one endpoint is the most common probe mistake.

          # STARTUP: "has it finished booting?" Gives a slow start up to
          # 30 x 2s = 60s before liveness is allowed to kill anything, without
          # having to make the liveness probe itself sloppy.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2

          # LIVENESS: "is the process wedged and in need of a restart?"
          # Deliberately checks nothing but the process itself. A liveness probe
          # that checks a database turns a dependency blip into a cluster-wide
          # restart storm — the single most effective way to turn a small
          # incident into a large one.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # READINESS: "should this pod receive traffic right now?"
          # Flips to 503 the instant SIGTERM arrives, so the Endpoints
          # controller removes the pod before the server stops accepting.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1

          # Container-level security context. Belt and braces with the pod-level
          # one above; the API server enforces the stricter of the two.
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL

          volumeMounts:
            # readOnlyRootFilesystem means the process cannot write anywhere, so
            # give it an explicit tmpfs. The Go runtime and the OTLP exporter do
            # not need it today, but a read-only root with no writable temp is a
            # trap that bites the first time anything calls os.CreateTemp.
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi

      # Nothing in this app talks to the Kubernetes API, so do not hand it a
      # token it could leak.
      automountServiceAccountToken: false
---
# PodDisruptionBudget.
#
# Protects the availability SLO during VOLUNTARY disruptions — node drains,
# cluster upgrades, descheduler evictions. Without it, `kubectl drain` happily
# evicts both replicas at once and you eat the downtime out of the error budget
# for no reason.
#
# minAvailable: 1 with 2 replicas means a drain proceeds one pod at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders-api
  namespace: demo
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/part-of: k8s-observability-stack
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
      app.kubernetes.io/instance: orders-api
